# Contributor License Agreement check.
#
# On every pull request, checks that each author has signed CLA.md. To sign, a
# contributor comments the exact sentence below on their pull request.
# Signatures are recorded on the `cla-signatures` branch, never on main.
#
# Under-18 contributors sign a guardian form by email FIRST (docs/cla-guardian-form.md).
# A maintainer then tells them to comment the sentence. The public record never
# says who is a minor.
#
# pull_request_target runs with this repository's token but never checks out
# or runs the pull request's code, which is what keeps it safe.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1, pinned by commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla-v1.json'
          path-to-document: 'https://github.com/softwareconvene/mealconvene/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot]'
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for contributing to MealConvene. Before this can be merged, please read the
            [Contributor License Agreement](https://github.com/softwareconvene/mealconvene/blob/main/CLA.md).
            You keep your copyright. If you agree, comment the sentence below on this pull request.


            **If you are under 18, don't comment yet.** Email contact@softwareconvene.org and we'll send
            a short form for you and a parent or guardian. Please don't mention your age here.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
